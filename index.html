<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的知識圖譜</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>🧠 我的知識圖譜</h1>
    <input id="search" type="text" placeholder="搜尋節點...">
  </header>

  <svg id="graph"></svg>

  <div id="legend"></div>

  <div id="hint">拖曳節點・滾輪縮放・點擊節點看筆記</div>

  <div id="panel">
    <button class="close-btn" id="close-panel">✕</button>
    <span class="category-tag" id="panel-tag"></span>
    <h2 id="panel-title"></h2>
    <div class="date" id="panel-date"></div>
    <div class="notes" id="panel-notes"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="js/graph.js"></script>
</body>
</html>
